app:
  name: "ai-genai-prompt-engineering-patterns"
  version: "1.0.0"

llm:
  provider: "anthropic"
  model: "claude-sonnet-4-20250514"
  temperature: 0.7
  max_tokens: 4096

patterns:
  chain_of_thought: true
  few_shot_max_examples: 5
  self_consistency_samples: 3
  tree_of_thought_branches: 3

testing:
  regression_threshold: 0.9
  ab_test_min_samples: 20
  ab_test_confidence: 0.95

management:
  storage_dir: "data/prompts"
  enable_versioning: true

api:
  host: "0.0.0.0"
  port: 8000
  reload: false

logging:
  level: "INFO"
  format: "json"
  file: "logs/app.log"
